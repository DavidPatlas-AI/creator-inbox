<head>
<meta charset="utf-8">

<style>
/* Layout: a phone-first mail desk. Sticky header with "what's left" + two big sections (private messages / comments).
   Each card reads like a sentence: [platform logo] who wrote, on what (video / post / story / private), then the message
   as a chat bubble, the prepared reply as an outgoing bubble, then large labelled action buttons. */
:root{
  --bg:#f4f2ee; --paper:#ffffff; --ink:#1d2230; --muted:#5d6577; --line:#e2ded6; --soft:#ece8e1;
  --accent:#264b8c; --accent-ink:#ffffff; --accent-soft:#e6ecf7;
  --good:#1d7a4c; --good-soft:#e1f2e8; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#a3262a; --bad-soft:#f8e3e3;
  --them:#f1efe9; --us:#e3ecfa;
  --display:"Frank Ruhl Libre", "PT Serif", Georgia, serif;
  --body:"Assistant", "PT Sans", "Segoe UI", Arial, sans-serif;
  --ru:"PT Serif", Georgia, serif;
  --r:18px;
  color-scheme:light;
}
html[lang="ru"]{ --display:"PT Serif", Georgia, serif; --body:"PT Sans", "Segoe UI", Arial, sans-serif }
@media (prefers-color-scheme: dark){:root{
  --bg:#12151c; --paper:#1b202a; --ink:#eef0f5; --muted:#a3abbd; --line:#2c3341; --soft:#232a36;
  --accent:#8fb4f2; --accent-ink:#0e1525; --accent-soft:#1f2e4a;
  --good:#6fd3a0; --good-soft:#163527; --warn:#f0c46a; --warn-soft:#3a2e12; --bad:#f39a9d; --bad-soft:#3d1c1e;
  --them:#232a36; --us:#1f2e4a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.5;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.headrow{display:flex;align-items:center;gap:12px}
.headrow .t{flex:1;min-width:0}
h1{font-family:var(--display);font-size:clamp(23px,6.2vw,30px);line-height:1.1;margin:0}
.left{font-size:16px;color:var(--muted);margin-top:2px}
.left b{color:var(--ink);font-variant-numeric:tabular-nums}
.iconbtn{flex:none;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;cursor:pointer}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:17px;line-height:1.2}
.sec small{font-weight:600;font-size:14px;color:var(--muted)}
.sec .n{font-size:15px;font-weight:800;background:var(--soft);border-radius:999px;padding:0 10px;font-variant-numeric:tabular-nums}
.sec[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.sec[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.sec[aria-pressed="true"] .n{background:var(--accent-ink);color:var(--accent)}
.more{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.more::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--paper)}
.pill .n{font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}

/* Body */
main.wrap{padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
.help{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.help h2{margin:0;font-family:var(--display);font-size:22px}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.help .ok{align-self:stretch;min-height:52px;border-radius:14px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;cursor:pointer}

.hidden-box{background:var(--bad-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card .in{padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;gap:12px;align-items:flex-start}
.logo{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.logo svg{width:44px;height:44px;display:block}
.headtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sentence{font-size:18px;line-height:1.35}
.sentence .who{font-weight:800;unicode-bidi:isolate}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--ink)}
.chip svg{width:15px;height:15px}
.chip.dm{background:#fdecc8;color:#6b4300}
.chip.story{background:#fbe0ef;color:#8a1857}
.chip.video{background:#ffe1e1;color:#8f1414}
.chip.post{background:#e1ecff;color:#1d4590}
.chip.live{background:#ffe1e1;color:#8f1414}
@media (prefers-color-scheme: dark){.chip.dm{background:#3a2e12;color:#f0c46a}.chip.story{background:#3a1a2c;color:#f3a3cf}.chip.video,.chip.live{background:#3d1c1e;color:#f39a9d}.chip.post{background:#1f2e4a;color:#8fb4f2}}
.date{font-size:14px;color:var(--muted)}
.cat{font-size:14px;font-weight:800;border-radius:999px;padding:3px 10px}
.cat.R{background:#ede3fb;color:#4b2591} .cat.Q{background:#e1f2e8;color:#185e3a} .cat.M{background:#e6ecf7;color:#264b8c} .cat.T{background:var(--soft);color:var(--muted)}
@media (prefers-color-scheme: dark){.cat.R{background:#2e2244;color:#c9b3f5}.cat.Q{background:#163527;color:#6fd3a0}.cat.M{background:#1f2e4a;color:#8fb4f2}}
.card.R{border-color:#b9a1e6;border-width:2px}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.ctx{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:8px;text-decoration:none;color:inherit;min-width:0}
.ctx img{flex:none;width:96px;height:54px;object-fit:cover;border-radius:8px;background:var(--line)}
.ctx .ct{min-width:0;font-size:15px;line-height:1.3}
.ctx .ct b{display:block;font-size:13px;color:var(--muted);font-weight:700}
.ctx .ct span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;unicode-bidi:plaintext}
.bubbles{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:92%;padding:10px 14px;border-radius:18px;font-family:var(--ru);font-size:19px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.bubble.them{background:var(--them);align-self:flex-start;border-start-start-radius:6px}
.bubble.us{background:var(--us);align-self:flex-end;border-start-end-radius:6px}
.bubble small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);margin-bottom:2px}
.replybox{display:flex;flex-direction:column;gap:6px}
.replybox label{font-size:15px;font-weight:700;color:var(--muted)}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--us);color:var(--ink);font-family:var(--ru);font-size:19px;line-height:1.45;resize:vertical;unicode-bidi:plaintext}
.vis{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.vis svg{width:16px;height:16px;flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .full{grid-column:1/-1}
.btn{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px}
.btn svg{width:22px;height:22px;flex:none}
.btn.reply{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.like{border-color:var(--good);color:var(--good)}
.btn.del{border-color:var(--bad);color:var(--bad)}
.btn.later{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45}
.status{border-radius:14px;padding:12px 14px;font-size:17px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.status.wait{background:var(--accent-soft)} .status.done{background:var(--good-soft)} .status.del{background:var(--bad-soft)}
.undo{background:none;border:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:6px;font-weight:700}
.confirm{background:var(--bad-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.empty{background:var(--paper);border:2px dashed var(--line);border-radius:var(--r);padding:30px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--display);font-size:24px;color:var(--ink);margin-bottom:6px}
.note{color:var(--muted);font-size:15px;margin:0;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:15px}
.members{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.mrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow .lvl{color:var(--muted);font-size:15px}
h2.sub{font-family:var(--display);font-size:22px;margin:6px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:999px;font-size:17px;max-width:calc(100% - 28px);z-index:10;display:flex;align-items:center;gap:12px}
.toast button{background:var(--bg);color:var(--ink);border:none;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer}
.focusbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.focusbar .pos{font-weight:800;font-size:17px}
.focusbar .pos span{color:var(--muted);font-weight:600}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navbtn{min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-weight:800;font-size:17px;cursor:pointer}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:800;font-size:16px;text-decoration:underline;cursor:pointer;padding:6px}
.allgood{background:var(--good-soft);border-radius:var(--r);padding:28px 18px;text-align:center}
.allgood strong{display:block;font-family:var(--display);font-size:26px;margin-bottom:6px}
html.big body{font-size:22px}
html.big .bubble,html.big textarea{font-size:23px}
html.big .sentence{font-size:21px}
html.big .btn{font-size:20px;min-height:62px}
/* "everything you marked is saved" — always visible once something was chosen */
.saved{background:var(--good-soft);color:var(--ink);border:2px solid var(--good);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.35}
.saved .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.saved b{font-variant-numeric:tabular-nums}
.drafthint{font-size:15px;font-weight:700;border-radius:10px;padding:6px 10px;background:var(--accent-soft);color:var(--accent)}
.drafthint.own{background:#ede3fb;color:#4b2591}
@media (prefers-color-scheme: dark){.drafthint.own{background:#2e2244;color:#c9b3f5}}
.localsave{font-size:14px;color:var(--good);font-weight:700;min-height:1em}
/* ===== Design layer v2 (4.11): navy + gold, softer cards, clearer hierarchy ===== */
:root{ --navy:#14213d; --navy2:#22345e; --gold:#c9a24a; --gold-soft:#f6ecd3; --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.07) }
@media (prefers-color-scheme: dark){:root{ --navy:#0d1526; --navy2:#1a2847; --gold:#e0bd6a; --gold-soft:#3a2f17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25) }}
body{background:radial-gradient(1200px 500px at 50% -200px, var(--gold-soft), transparent 70%), var(--bg)}
.top{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 4px 18px rgba(20,33,61,.25);border-bottom:3px solid var(--gold)}
.top .left{color:rgba(255,255,255,.75)} .top .left b{color:#fff}
.top .progress{background:rgba(255,255,255,.15);height:7px} .top .progress i{background:linear-gradient(90deg,var(--gold),#f3d98c)}
.top h1{color:#fff;letter-spacing:.2px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;object-fit:cover;border:2.5px solid var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.25)}
.top .iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.top .sec{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.top .sec small{color:rgba(255,255,255,.7)}
.top .sec .n{background:rgba(255,255,255,.16);color:#fff}
.top .sec[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.top .sec[aria-pressed="true"] small{color:var(--navy)} .top .sec[aria-pressed="true"] .n{background:var(--navy);color:var(--gold)}
.top .pill{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.22)}
.top .pill[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
.card{border:none;border-radius:22px;box-shadow:var(--shadow);position:relative}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--pc,#c9a24a)}
.card.p-youtube{--pc:#ff0000} .card.p-instagram{--pc:linear-gradient(#feda75,#d62976,#4f5bd5)} .card.p-tiktok{--pc:linear-gradient(#25f4ee,#fe2c55)} .card.p-facebook{--pc:#1877f2}
.card.p-instagram::before,.card.p-tiktok::before{background:var(--pc)}
.card.R{box-shadow:0 0 0 2px #b9a1e6,var(--shadow)}
.card .in{padding:16px 16px 18px 20px;gap:14px}
.who-ava{flex:none;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:15px;color:#fff;margin-inline-end:8px;vertical-align:middle}
.ctx{background:linear-gradient(90deg,var(--soft),transparent);border:1px solid var(--line)}
.bubble{box-shadow:0 1px 1px rgba(0,0,0,.04)}
.bubble.them{background:var(--them);border:1px solid var(--line)}
.replybox textarea{background:linear-gradient(180deg,var(--us),var(--paper));border-color:#bcd0ef;border-radius:18px 18px 6px 18px}
html[dir="rtl"] .replybox textarea{border-radius:18px 18px 18px 6px}
.replybox label{color:var(--accent);display:flex;align-items:center;gap:6px}
.replybox label::before{content:"✍️"}
.drafthint{border-inline-start:4px solid var(--accent)} .drafthint.own{border-inline-start-color:#7d55c7}
.btn{border-radius:16px;transition:transform .08s ease, box-shadow .15s ease}
.btn:active{transform:scale(.98)}
.btn.reply{background:linear-gradient(180deg,#2f5aa6,var(--accent));box-shadow:0 4px 12px rgba(38,75,140,.3)}
.btn.like{background:var(--good-soft)} .btn.later{background:var(--warn-soft)} .btn.del{background:var(--bad-soft)}
.saved{border-width:0;box-shadow:0 0 0 2px var(--good),var(--shadow);border-radius:20px}
.focusbar .pos{font-family:var(--display);font-size:20px}
.navbtn{border:none;box-shadow:var(--shadow)}
.help{border:none;box-shadow:var(--shadow);border-top:4px solid var(--gold)}
.help .steps .num{background:var(--gold);color:var(--navy)}
.allgood{box-shadow:var(--shadow)}
.toast{box-shadow:0 8px 24px rgba(0,0,0,.25)}
.top .pill.hot{border-color:var(--gold);color:#f3d98c}
.top .pill.hot[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.statHero{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:var(--shadow);border-bottom:4px solid var(--gold)}
.statHero .lbl{opacity:.8;font-size:16px} .statHero .big{font-family:var(--display);font-size:52px;line-height:1.1;color:#f3d98c;font-variant-numeric:tabular-nums} .statHero .upd{opacity:.65;font-size:14px}
.pgrid{display:grid;gap:12px}
@media (min-width:640px){.pgrid{grid-template-columns:1fr 1fr}}
.pcard{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:16px 16px 14px 20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.pcard::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--pc,#c9a24a)}
.pcard.p-youtube{--pc:#ff0000} .pcard.p-instagram::before{background:linear-gradient(#feda75,#d62976,#4f5bd5)} .pcard.p-tiktok::before{background:linear-gradient(#25f4ee,#fe2c55)} .pcard.p-facebook{--pc:#1877f2} .pcard.p-telegram{--pc:#229ed9}
.phead{display:flex;align-items:center;gap:10px} .phead svg{width:36px;height:36px;flex:none}
.pname{font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;flex:1}
.pfol b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums} .pfol span{color:var(--muted);font-size:14px}
.pfact{font-size:15px;color:var(--muted)}
.ptoday{background:var(--soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ptl{font-weight:800;font-size:14px;color:var(--accent)} .pnone{font-size:15px;color:var(--muted)}
.pitem{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.35}
.pitem .pv{flex:none;font-weight:800;font-variant-numeric:tabular-nums;color:var(--good)}
.pnote{font-size:14px;color:var(--muted);font-style:italic}

/* What was it written on — one plain label + one plain sentence. */
function sourceOf(it){
  if(it.kind==="dm") return it.source==="story" ? "story-reply" : "dm";
  if(it.kind==="email") return "email";
  return it.source || (it.platform==="instagram"?"reel":"video");
}
function chipFor(src){
  const map={
    "dm":["dm",I.dm,L("הודעה פרטית","Личное сообщение")],
    "story-reply":["story",I.story,L("תגובה לסטורי (בפרטי)","Ответ на сторис (лично)")],
    "email":["dm",I.dm,L("מייל","Письмо")],
    "video":["video",I.video,L("על סרטון","К видео")],
    "short":["video",I.video,L("על שורט","К шортсу")],
    "reel":["video",I.video,L("על רילס","К рилсу")],
    "live":["live",I.live,L("על שידור חי","К трансляции")],
    "post":["post",I.post,L("על פוסט","К посту")],
    "community":["post",I.post,L("על פוסט בקהילה","К посту в сообществе")],
    "story":["story",I.story,L("על סטורי","К сторис")],
    "channel":["post",I.post,L("בערוץ","В канале")]
  };
  return map[src]||map.video;
}
function sentence(it){
  const p=PNAME[it.platform]||it.platform, src=sourceOf(it);
  if(it.kind==="group") return [L("כמה צופים כתבו תגובות חמות קצרות ב-","Несколько зрителей написали тёплые слова в ")+p, ""];
  if(src==="dm") return [L(" שלח/ה לך הודעה פרטית ב-"," прислал(а) вам личное сообщение в ")+p, "who"];
  if(src==="story-reply") return [L(" ענה/תה לסטורי שלך ב-"," ответил(а) на вашу сторис в ")+p, "who"];
  if(src==="email") return [L(" שלח/ה לך מייל"," прислал(а) вам письмо"), "who"];
  if(it.kind==="reply") return [L(" ענה/תה לתגובה שלך ב-"," ответил(а) на ваш комментарий в ")+p, "who"];
  return [L(" כתב/ה תגובה ב-"," написал(а) комментарий в ")+p, "who"];
}
function visibility(it){
  const src=sourceOf(it);
  if(it.kind==="group") return [I.heart,L("כל אחת מהתגובות תקבל לייק.","Каждый комментарий получит «Нравится».")];
  if(src==="dm"||src==="story-reply"||src==="email") return [I.lock,L("את התשובה יראה רק האדם הזה.","Ответ увидит только этот человек.")];

}

  updateSideTab();

  const visible=items.filter(it=>it.flag!=="hostile"), handled=visible.filter(it=>bucket(it)!=="open").length;
  $("prog").style.width=(visible.length?Math.round(100*handled/visible.length):0)+"%";
  document.querySelectorAll(".sec").forEach(b=>b.setAttribute("aria-pressed",String(view==="open"&&b.dataset.sec===sec)));

  // secondary row: platforms (when browsing) + later / waiting / done / club
  const more=$("more"); more.replaceChildren();
  if(view==="open"){
    const pool=items.filter(it=>bucket(it)==="open" && (sec==="dm"?isDM(it):!isDM(it)) && it.flag!=="hostile");
    const plats=[...new Set(pool.map(it=>it.platform))];
    if(plats.length>1){
      const all=el("button","pill"); all.append(el("span",null,L("הכול","Все")), el("span","n",String(pool.length))); all.setAttribute("aria-pressed",String(plat==="all")); all.onclick=()=>{plat="all";render()}; more.append(all);
      plats.forEach(p=>{const b=el("button","pill"); b.append(svg(LOGO[p]||LOGO.email), el("span",null,PNAME[p]||p), el("span","n",String(pool.filter(i=>i.platform===p).length))); b.setAttribute("aria-pressed",String(plat===p)); b.onclick=()=>{plat=p;render()}; more.append(b)});
    }
  }
  const cnt={later:0,wait:0,done:0}; items.forEach(it=>{const b=bucket(it); if(b in cnt) cnt[b]++});
  const toSend=items.filter(it=>it.decision==="reply"&&it.status!=="done").length;
  const nIdeas=items.filter(it=>it.idea).length, nLeads=items.filter(it=>it.lead).length;
  [...(lang==="he"?[["send","📤 לשליחה"]]:[]),["stats",L("📊 הערוץ","📊 Канал")],["ideas",L("💡 נושאים לשיעורים","💡 Темы уроков")],["leads",L("🎓 תלמידים","🎓 Ученики")],["digest",L("📰 כרוניקת היום","📰 Хроника дня")],["later",L("לאחר כך","На потом")],["wait",L("ממתין לביצוע","Ждёт выполнения")],["done",L("בוצע","Готово")],["club",L("מועדון","Клуб")]].forEach(([k,t])=>{
    const b=el("button","pill"+(k==="stats"||k==="digest"||k==="send"?" hot":"")); b.append(el("span",null,t)); if(k!=="stats"&&k!=="digest") b.append(el("span","n",k==="club"?String(club?.total??"–"):k==="send"?String(toSend):k==="ideas"?String(nIdeas):k==="leads"?String(nLeads):String(cnt[k]))); b.setAttribute("aria-pressed",String(view===k));
    b.onclick=()=>{view=view===k?"open":k; plat="all"; render(); scrollTo({top:0})}; more.append(b);
  });

  const main=$("main"); main.replaceChildren();
  if(!helpSeen && view==="open") main.append(helpCard());
  if(view==="club"){ renderClub(main); return }
  if(view==="send"){ if(lang!=="he"){ view="open"; return render() } renderSend(main); return }
  if(view==="ideas"){ renderIdeas(main); return }
  if(view==="leads"){ renderLeads(main); return }
  if(view==="stats"){ renderStats(main); return }
  if(view==="digest"){ renderDigest(main); return }

  let list;
  if(view==="open"){
    list=items.filter(it=>bucket(it)==="open" && (sec==="dm"?isDM(it):!isDM(it)) && (plat==="all"||it.platform===plat));
  } else list=items.filter(it=>bucket(it)===view);
  // personal questions for the rav first, then questions, then thanks; newest first inside each group
  const RANK={R:0,Q:1,M:2,D:3,T:4};
  list.sort((a,b)=>(isUrgent(b)-isUrgent(a)) || ((RANK[a.cat]??3)-(RANK[b.cat]??3)) || String(b.date||"").localeCompare(String(a.date||"")));

  // sort-by-type chips: urgent / questions / thanks / curses ...
  if(view==="open"){
    main.append(catChips(list));
    if(ctype==="H") list=list.filter(it=>it.flag==="hostile");
    else if(ctype==="U") list=list.filter(isUrgent);
    else if(ctype!=="all") list=list.filter(it=>it.flag!=="hostile" && catOf(it)===ctype);
    // thanks: approve every prepared answer at once

      if(ready.length>1){

          const no=btn("",null,L("לא","Нет"),()=>{ bulkThanks=false; render() }); r2.append(y,no); bx.append(r2);
        } else {
          const b=btn("like",I.heart,L("✓ לאשר את כל התודות ("+ready.length+")","✓ Одобрить все благодарности ("+ready.length+")"),()=>{ bulkThanks=true; render() }); bx.append(b);
        }
        main.append(bx);
      }
    }
  }

  const hostile = view==="open" ? list.filter(it=>it.flag==="hostile") : [];

  // one-at-a-time mode: a single large message, then the next one comes up by itself
  if(focus && view==="open" && !showHostile && ctype!=="H"){
    const queue=list.filter(it=>it.flag!=="hostile");
    if(focusIdx>=queue.length) focusIdx=Math.max(0,queue.length-1);
    const bar=el("div","focusbar");
    const pos=el("div","pos");
    if(queue.length){ pos.append(document.createTextNode(L("הודעה ","Сообщение ")+(focusIdx+1)+" "), el("span",null,L("מתוך ","из ")+queue.length)) }
    const toList=el("button","linkbtn",L("להציג את כולן ברשימה","Показать списком")); toList.onclick=()=>{focus=false; try{localStorage.setItem("inboxFocus","0")}catch(e){} render()};
    bar.append(pos,toList); main.append(savedBanner()||""); main.append(bar);
    const chosen=items.filter(it=>bucket(it)==="wait").length;

      const done=btn("reply",I.send,L("סיימתי לעכשיו: לשלוח לדוד ("+chosen+")","Готово: отправить Давиду ("+chosen+")"),async()=>{
        done.disabled=true;
        try{ const r=await fetch("/api/done",{method:"POST",credentials:"same-origin"}); if(!r.ok) throw 0; toast(L("נשלח לדוד. תודה!","Отправлено Давиду. Спасибо!")) }
        catch(e){ toast(L("השליחה נכשלה, כדאי לנסות שוב","Не удалось отправить")); done.disabled=false }
      });
      main.append(done);
    }
    if(!queue.length){
      const g=el("div","allgood"); g.append(el("strong",null, sec==="dm"?L("אין הודעות פרטיות שמחכות","Личных сообщений нет"):L("כל התגובות טופלו","Все комментарии разобраны")), document.createTextNode(L("תודה! אפשר לעבור ללשונית השנייה למעלה.","Спасибо! Можно перейти во вторую вкладку сверху.")));

      const nav=el("div","navrow");
      const prev=el("button","navbtn",L("→ הקודמת","← Предыдущее")); prev.disabled=focusIdx===0; prev.onclick=()=>{focusIdx--; render(); scrollTo({top:0})};
      const next=el("button","navbtn",L("הבאה ←","Следующее →")); next.disabled=focusIdx>=queue.length-1; next.onclick=()=>{focusIdx++; render(); scrollTo({top:0})};
      nav.append(prev,next); main.append(nav);
      if(queue.length>1) main.append(el("p","note swipehint",L("👆 אפשר גם להחליק עם האצבע בין ההודעות","👆 Можно листать сообщения пальцем — влево и вправо")));
    }
    if(hostile.length){ const h=el("button","linkbtn",L("יש גם "+hostile.length+" תגובות גסות מוסתרות","Ещё скрыто грубых: "+hostile.length)); h.onclick=()=>{focus=false; render()}; main.append(h) }
    return;
  }
  if(view==="open"){ const sb=savedBanner(); if(sb) main.append(sb) }
  if(view==="open" && !focus){ const tf=el("button","linkbtn",L("לעבור למצב הודעה אחת בכל פעם","Показывать по одному")); tf.onclick=()=>{focus=true; focusIdx=0; showHostile=false; try{localStorage.setItem("inboxFocus","1")}catch(e){} render(); scrollTo({top:0})}; main.append(tf) }

  art.append(body, el("div","sign","— "+L("המזכיר","Секретарь")));
  main.append(art);
  // ---- visual supplement: mood ring, word cloud, readers' letters ----
  if(D.mood&&D.mood.length){
    const tot=D.mood.reduce((s,m)=>s+m.val,0)||1, C={T:"#1d7a4c",Q:"#264b8c",O:"#c9a24a",H:"#a3262a"};
    const R=54, CIRC=2*Math.PI*R; let acc=0;
    let arcs=""; D.mood.forEach(m=>{ const len=CIRC*m.val/tot; arcs+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${C[m.k]||"#888"}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(CIRC-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)"><animate attributeName="stroke-dasharray" from="0 ${CIRC.toFixed(2)}" to="${len.toFixed(2)} ${(CIRC-len).toFixed(2)}" dur=".9s" fill="freeze"/></circle>`; acc+=len });
    const sec=el("section","supp mood"); sec.append(el("h3",null,L("🌡️ מצב הרוח של היום","🌡️ Настроение дня")));
    const row=el("div","moodrow");
    const ring=document.createElement("div"); ring.className="ring"; ring.innerHTML=`<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="mood">${arcs}<text x="70" y="66" text-anchor="middle" class="rt1">${tot}</text><text x="70" y="86" text-anchor="middle" class="rt2">${L("תגובות","отзывов")}</text></svg>`;
    const lg=el("ul","legend"); D.mood.forEach(m=>{ const li=el("li"); const sw=el("i"); sw.style.background=C[m.k]; li.append(sw, el("span",null,T2(m)), el("b",null,m.val+" · "+Math.round(100*m.val/tot)+"%")); lg.append(li) });
    row.append(ring,lg); sec.append(row); if(D.mood_note) sec.append(el("p","snote",T2(D.mood_note))); main.append(sec);
  }
  if(D.cloud&&D.cloud.length){
    const sec=el("section","supp"); sec.append(el("h3",null,L("☁️ ענן המילים של הצופים","☁️ Облако слов зрителей")));
    const cl=el("div","cloud"); const mx=Math.max(...D.cloud.map(w=>w.n)), mn=Math.min(...D.cloud.map(w=>w.n));
    const pal=["#264b8c","#c9a24a","#1d7a4c","#7d55c7","#a3262a","#14213d"];
    D.cloud.slice().sort(()=>0).forEach((w,i)=>{ const s=el("span",null,T2(w)); const k=(w.n-mn)/Math.max(1,mx-mn); s.style.fontSize=(15+k*26).toFixed(0)+"px"; s.style.color=pal[i%pal.length]; s.style.fontWeight=k>.5?"800":"600"; s.style.animationDelay=(i*40)+"ms"; cl.append(s) });
    sec.append(cl); main.append(sec);
  }
  if(D.letters&&D.letters.length){
    const sec=el("section","supp"); sec.append(el("h3",null,L("✉️ מכתבים למערכת","✉️ Письма в редакцию")));
    const g=el("div","letters");
    D.letters.forEach(x=>{ const c=el("figure","letter"); const im=el("img"); if(x.ava&&/^ava\/[\w.-]+\.jpg$/.test(x.ava)) im.src=x.ava; im.alt=""; im.onerror=()=>im.remove(); const q=el("blockquote",null,"«"+T2(x)+"»"); const cap=el("figcaption"); cap.append(svg(LOGO[x.platform]||LOGO.email), document.createTextNode(x.who)); c.append(im,q,cap); g.append(c) });
    sec.append(g); main.append(sec);
  }
  // archive of all editions (newest first)
  if(idx && idx.length){
    const ar=el("section","archive"); ar.append(el("h3",null,L("📚 ארכיון הגיליונות","📚 Архив выпусков")));
    idx.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach((e,i)=>{
      const r=el("button","arow"); r.type="button";
      const cur = digestDate ? digestDate===e.date : i===0; r.setAttribute("aria-current",String(cur));
      r.append(el("span",null,T2(e.title)), el("small",null,L("מס' ","№ ")+e.edition+" · "+new Date(e.date+"T12:00:00").toLocaleDateString(L("he-IL","ru-RU"),{day:"numeric",month:"short"})));
      r.onclick=()=>{ digestDate = i===0 ? null : e.date; render(); scrollTo({top:0}) };
      ar.append(r);
    });
    main.append(ar);
  }
}

/* ---------- data ---------- */
async function load(){
  if(loggedIn===false){ const e=el("div","empty"); e.append(el("strong",null,L("צריך את הקישור האישי","Нужна личная ссылка")), document.createTextNode(L("פותחים את הדף מהקישור שדוד שלח.","Откройте страницу по ссылке от Давида."))); $("main").replaceChildren(e); return }
  if(!items.length){ try{ const c=JSON.parse(localStorage.getItem("inboxCache")||"null"); if(c&&c.items){ items=c.items; club=c.club; if(!load.done){ load.done=true; if(!items.some(it=>isDM(it)&&it.flag!=="hostile"&&bucket(it)==="open")) sec="comments" } render() } }catch(e){} }
  try{
    const r=await fetch("/api/items",{cache:"no-store",credentials:"same-origin"});
    if(r.status===403){ loggedIn=false; forget(); return load() }
    loggedIn=true;
    const j=await r.json(); items=j.items||[]; club=j.club||null;
    try{ localStorage.setItem("inboxCache", JSON.stringify({items,club})) }catch(e){}
    if(!load.done){ load.done=true; if(!items.some(it=>isDM(it)&&it.flag!=="hostile"&&bucket(it)==="open")) sec="comments" }
    if(!busy) render();
  }catch(e){ toast(L("אין חיבור לאינטרנט","Нет связи с интернетом")) }
}
async function decide(it, decision, replyText, quiet){
  const prev={decision:it.decision??null, replyText:it.replyText??null};
  confirming=null; busy=true;
  try{
    const r=await fetch("/api/decide",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({id:it.id,decision,replyText})});
    if(!r.ok) throw new Error(r.status);
    it.decision=decision; if(decision==="reply"||decision==="later") it.replyText=replyText??null; delete drafts[it.id]; saveDraftsLocal();
    lastSavedAt=new Date();
    try{ localStorage.setItem("inboxCache", JSON.stringify({items,club})) }catch(e){}
    if(!quiet){
      const msg=decision===null?L("בוטל","Отменено"):decision==="later"?L("✓ נשמר לאחר כך","✓ Сохранено на потом"):decision==="skip"?L("✓ נשמר: דילוג","✓ Сохранено: пропустить"):decision==="delete"?L("✓ נשמר: למחיקה","✓ Сохранено: удалить"):decision==="like"?L("✓ נשמר: לייק. דוד יבצע","✓ Сохранено: «Нравится». Давид выполнит"):L("✓ נשמר. דוד ישלח","✓ Сохранено. Давид отправит");
      toast(msg, decision===null?null:()=>decide(it, prev.decision, prev.replyText));
    }
  }catch(e){ toast(L("השמירה נכשלה, כדאי לנסות שוב","Не удалось сохранить, попробуйте ещё раз")) }
  busy=false; if(!quiet) render();
}

/* ---------- wiring ---------- */
document.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{sec=b.dataset.sec; view="open"; plat="all"; ctype="all"; confirming=null; focusIdx=0; render(); scrollTo({top:0})});
$("sizeBtn").onclick=()=>{big=!big; document.documentElement.classList.toggle("big",big); $("sizeBtn").textContent=big?"A−":"A+"; try{localStorage.setItem("inboxBig",big?"1":"0")}catch(e){}};
$("sizeBtn").textContent=big?"A−":"A+";
$("langBtn").onclick=()=>{lang=lang==="ru"?"he":"ru"; try{sessionStorage.setItem("inboxLangSession",lang)}catch(e){} applyLang(); render(); document.querySelector(".afileov")?.remove(); const ov=document.querySelector(".edition"); if(ov){ ov.remove(); showEdition(true) } };
$("helpBtn").onclick=()=>{helpSeen=false; view="open"; render(); scrollTo({top:0})};

/* finger swipe between messages in one-at-a-time mode (not while typing or pressing buttons) */
(function(){
  let sx=0, sy=0, on=false;
  const main=$("main");
  main.addEventListener("touchstart",e=>{ if(e.touches.length!==1) return; const t=e.target; if(t.closest("textarea,button,a,details,input")) { on=false; return } on=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY },{passive:true});
  main.addEventListener("touchend",e=>{
    if(!on) return; on=false;
    if(!(focus && view==="open" && ctype!=="H")) return;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<70 || Math.abs(dx)<Math.abs(dy)*1.6) return;
    const forward = (document.documentElement.dir==="rtl") ? dx>0 : dx<0;   // swipe toward reading direction = next
    const card=main.querySelector(".card"); const navs=main.querySelectorAll(".navbtn"); if(!card||navs.length<2) return;
    const btn = forward ? navs[1] : navs[0]; if(btn.disabled) return;
    card.style.transition="transform .18s ease, opacity .18s ease"; card.style.transform="translateX("+(dx<0?-40:40)+"px)"; card.style.opacity=".2";
    setTimeout(()=>btn.click(),150);
  },{passive:true});
})();

/* side tab "daily edition": always visible, red dot while today's edition is unread */
async function updateSideTab(){
  $("sideTxt").textContent=L("📰 הגיליון היומי","📰 Выпуск дня");
  $("sideTab").setAttribute("aria-pressed",String(view==="digest"));
  const D=await getJSON("digest"); let seen=null; try{ seen=localStorage.getItem("inboxEditionSeen") }catch(e){}
  $("sideDot").hidden = !(D && D.date && seen!==D.date);
}
$("sideTab").onclick=()=>{ digestDate=null; view = view==="digest" ? "open" : "digest"; render(); scrollTo({top:0}) };

/* ---------- the evening paper: a new chronicle "arrives" as a cover the first time the page is opened after it was published ---------- */
async function showEdition(force){
  const D=await getJSON("digest"); if(!D||!D.date) return;
  let seen=null; try{ seen=localStorage.getItem("inboxEditionSeen") }catch(e){}
  if(!force && seen===D.date) return;
  const A=lang==="ru"?D.ru:D.he;
  const ov=el("div","edition"); ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true");
  const paper=el("div","paper");
  const mast=el("div","mast"); const mav=el("img","mava"); mav.src="rav.jpg"; mav.alt=""; mast.append(mav, el("div","mname",L("עיתון הערב של היוצר","Вечерняя почта автора")), el("div","mline",new Date(D.date+"T20:00:00").toLocaleDateString(L("he-IL","ru-RU"),{weekday:"long",day:"numeric",month:"long",year:"numeric"})+" · "+L("גיליון מס' ","Выпуск № ")+(D.edition||1)));
  paper.append(mast);
  const badge=el("div","newbadge",D.kind==="weekly"?L("🗓️ הגיע הגיליון השבועי","🗓️ Пришёл недельный выпуск"):L("✉️ הגיע גיליון חדש","✉️ Пришёл новый выпуск")); paper.append(badge);
  paper.append(el("h2","etitle",A.title));
  if(A.teaser) paper.append(el("p","eteaser",A.teaser));
  if(D.numbers&&D.numbers.length){ const g=el("div","enums"); D.numbers.forEach(n=>{ const c=el("div","enum"); c.append(el("b",null,n.val), el("span",null,T2(n))); g.append(c) }); paper.append(g) }
  if(D.quote){ const q=el("blockquote","equote"); q.append(el("p",null,"«"+T2(D.quote)+"»"), el("cite",null,"— "+(D.quote.who||""))); paper.append(q) }
  const acts=el("div","eacts");
  const close=()=>{ try{localStorage.setItem("inboxEditionSeen",D.date)}catch(e){} ov.classList.add("out"); setTimeout(()=>ov.remove(),250); updateSideTab() };
  const read=el("button","btn reply",L("📰 לקרוא את הכרוניקה","📰 Читать хронику")); read.onclick=()=>{ close(); view="digest"; render(); scrollTo({top:0}) };
  const later=el("button","btn",L("✉️ קודם המכתבים","✉️ Сначала письма")); later.onclick=close;
  acts.append(read,later); paper.append(acts);
  ov.append(paper); document.body.append(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) close() });
  read.focus();
}
/* self-update: if a newer version of the page was published, reload once (phones and home-screen apps keep old copies) */
const PAGE_VERSION="2026-11-05c";
async function checkVersion(){
  try{
    const r=await fetch("version.json",{cache:"no-store"}); if(!r.ok) return;
    const v=(await r.json()).v;
    if(v && v!==PAGE_VERSION){
      let last=null; try{ last=sessionStorage.getItem("inboxReloadedFor") }catch(e){}
      if(last!==v){ try{ sessionStorage.setItem("inboxReloadedFor",v) }catch(e){} location.reload() }
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkVersion() });
checkVersion();
applyLang(); updateSideTab(); login().then(load).then(()=>showEdition(false));
setInterval(()=>{ if(document.visibilityState==="visible"&&!busy&&!confirming) load() },60000);
